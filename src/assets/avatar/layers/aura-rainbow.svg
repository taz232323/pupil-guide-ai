<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" fill="none">
  <defs>
    <radialGradient id="auraGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="swirlRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swirlOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swirlGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swirlBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swirlPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="auraBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <circle cx="384" cy="400" r="320" fill="url(#auraGlow)"/>

  <g filter="url(#auraBlur)" style="transform-origin:384px 400px; animation: auraSpin 18s linear infinite;">
    <path d="M384,400 m-260,0 a260,260 0 1,1 520,0 a260,260 0 1,1 -520,0"
          stroke="url(#swirlRed)" stroke-width="22" stroke-linecap="round" fill="none"
          stroke-dasharray="380 1240" stroke-dashoffset="0"/>
    <path d="M384,400 m-225,0 a225,225 0 1,1 450,0 a225,225 0 1,1 -450,0"
          stroke="url(#swirlOrange)" stroke-width="20" stroke-linecap="round" fill="none"
          stroke-dasharray="330 1080" stroke-dashoffset="120"/>
    <path d="M384,400 m-190,0 a190,190 0 1,1 380,0 a190,190 0 1,1 -380,0"
          stroke="url(#swirlGreen)" stroke-width="18" stroke-linecap="round" fill="none"
          stroke-dasharray="280 920" stroke-dashoffset="260"/>
    <path d="M384,400 m-155,0 a155,155 0 1,1 310,0 a155,155 0 1,1 -310,0"
          stroke="url(#swirlBlue)" stroke-width="16" stroke-linecap="round" fill="none"
          stroke-dasharray="230 760" stroke-dashoffset="400"/>
    <path d="M384,400 m-120,0 a120,120 0 1,1 240,0 a120,120 0 1,1 -240,0"
          stroke="url(#swirlPurple)" stroke-width="14" stroke-linecap="round" fill="none"
          stroke-dasharray="180 600" stroke-dashoffset="540"/>
  </g>

  <style>
    @keyframes auraSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</svg>
