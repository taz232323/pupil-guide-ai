name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Lint currently has pre-existing issues in legacy code, so it reports
      # but does not fail the build. Remove continue-on-error once lint is clean.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
